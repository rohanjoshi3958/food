name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep provider SDKs from making real network calls in CI.
      # Individual tests mock Anthropic/OpenAI; empty keys are a safety net.
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      AUTH_SECRET: ci-test-secret-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/food
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --ignore=tests/evals

      # FOOD-58: fixture-driven quality gates (receipt accuracy, ingredient
      # match rate, meal-plan acceptability) against tests/evals/baselines.json.
      # Fully mocked; live (paid) evals are opt-in via FOOD_EVAL_LIVE and
      # never run here. The metrics table is appended to the step summary.
      - name: Quality evals (mocked)
        run: pytest tests/evals
